services:
  - type: web
    name: fm26-scout-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Cors__Origins__0
        sync: false
      - key: Jwt__Issuer
        value: fm26-scout-api
      - key: Jwt__Audience
        value: fm26-scout-web
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__AccessMinutes
        value: "30"
      - key: Admin__ApiKey
        generateValue: true
