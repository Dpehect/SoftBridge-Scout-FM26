name: Update Top 5 League JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/scrape-top5-json.mjs"
      - ".github/workflows/update-top5-json.yml"

concurrency:
  group: update-top5-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape permitted FM26 top five league data
        run: node scripts/scrape-top5-json.mjs

      - name: Validate generated dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/data/players/top5.json
          count=$(node -e "const p=require('./apps/web/data/players/top5.json'); console.log(p.length)")
          echo "Generated player count: $count"
          test "$count" -gt 500

      - name: Commit updated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/players/*.json
          if git diff --cached --quiet; then
            echo "Player data is already current"
            exit 0
          fi
          git commit -m "data: refresh FM26 top five league players"
          git push
