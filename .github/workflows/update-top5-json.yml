name: Update Premier League Senior Squads

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/scrape-top5-json.mjs"
      - ".github/workflows/update-top5-json.yml"

concurrency:
  group: update-premier-league-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import Premier League senior squads
        run: node scripts/scrape-top5-json.mjs

      - name: Validate generated Premier League dataset
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/data/players/premier-league.json
          count=$(node -e "const p=require('./apps/web/data/players/premier-league.json'); console.log(p.length)")
          clubs=$(node -e "const p=require('./apps/web/data/players/premier-league.json'); console.log(new Set(p.map(x=>x.club)).size)")
          echo "Premier League players: $count"
          echo "Premier League clubs: $clubs"
          test "$count" -ge 350
          test "$clubs" -eq 20

      - name: Commit updated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/players/premier-league.json apps/web/data/players/top5.json
          if git diff --cached --quiet; then
            echo "Premier League player data is already current"
            exit 0
          fi
          git commit -m "data: refresh Premier League senior squads"
          git push
