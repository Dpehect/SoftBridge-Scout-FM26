services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fmscout}
      POSTGRES_USER: ${POSTGRES_USER:-fmscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmscout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FmScout.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${DATABASE_URL:-Host=postgres;Port=5432;Database=fmscout;Username=fmscout;Password=change-me}
      Jwt__Secret: ${JWT_SECRET:-replace-with-at-least-32-characters}
      Cors__Origins__0: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
